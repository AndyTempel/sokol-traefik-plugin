name: Verify

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v4
        with:
          go-version: '1.25.6'
          cache-dependency-path: |
            go.mod
            tests/yaegi/go.sum
      - name: Verify module
        run: go mod verify
      - name: Verify release tooling
        run: ./tests/release/run.sh
      - name: Run native tests with race detector
        run: go test -race -count=1 -timeout=2m ./...
      - name: Verify pinned Yaegi compatibility
        working-directory: tests/yaegi
        run: |
          go mod verify
          go test -count=1 -timeout=2m ./...
      - name: Run pinned Traefik compatibility harness
        run: ./tests/traefik/run.sh

  release:
    if: ${{ gitea.event_name == 'push' && gitea.ref == 'refs/heads/main' }}
    needs:
      - test
    runs-on: ubuntu-latest
    permissions:
      code: write
      releases: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publish versioned Gitea release
        env:
          GITEA_RELEASE_SERVER_URL: ${{ gitea.server_url }}
          GITEA_RELEASE_REPOSITORY: ${{ gitea.repository }}
          GITEA_RELEASE_SHA: ${{ gitea.sha }}
          GITEA_RELEASE_TOKEN: ${{ secrets.GITEA_TOKEN }}
        run: ./scripts/publish-gitea-release.sh
